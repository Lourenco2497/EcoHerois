<!doctype html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eco Heróis — Nível 1: Parque da Cidade</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Estilos Globais -->
    <link href="estilos.css" rel="stylesheet">
</head>

<body style="overflow: hidden;">
    <!-- Ecrã de Introdução da Missão -->
    <div id="nivel1-intro" class="level-intro-screen" style="background-image: url('imagens/fundos/nivel%201%20blur.png');">
        <div class="level-intro-card scale-in">
            <div class="eco-modal-mascot-header">
                <img src="imagens/mascote_final_fixe.png" alt="EcoFox Mascote" class="modal-mascot-img">
            </div>
            <h2>Missão 1: Parque da Cidade</h2>
            <p>
                Bem-vindo ao parque! As pessoas deixaram vários resíduos no chão e o ambiente está em perigo.
            </p>
            <p>
                O teu desafio é separar os <strong>14 resíduos</strong> nos ecopontos oficiais:
                <br>
                🔵 <strong>Azul</strong>: Papel e Cartão &nbsp;|&nbsp;
                🟡 <strong>Amarelo</strong>: Plástico e Metal &nbsp;|&nbsp;
                🟢 <strong>Verde</strong>: Vidro
            </p>
            <button id="btn-iniciar" class="eco-btn eco-btn-primary eco-btn-lg">
                🚀 Começar Desafio!
            </button>
        </div>
    </div>

    <!-- Contentor de Jogo -->
    <main id="nivel1-fundo" class="eco-game-container" style="background-image: url('imagens/fundos/46232.jpg'); display: none;">
        <div class="eco-game-stage" id="game-stage">
            <!-- 14 Resíduos a Limpar com Tamanhos Aumentados e Alta Visibilidade -->
            <img id="lixo-1" class="lixo-drag" data-tipo="papel" src="imagens/lixo/papel%20e%20cartão/caixa%20de%20cartão.webp" alt="Caixa de Cartão" style="width: 105px;">
            <img id="lixo-2" class="lixo-drag" data-tipo="vidro" src="imagens/lixo/vidro/garrafa%20partida%20vidro.png" alt="Garrafa de Vidro Quebrada" style="width: 88px;">
            <img id="lixo-3" class="lixo-drag" data-tipo="plastico" src="imagens/lixo/plástico%20e%20metal/cocacola.png" alt="Lata de Bebida" style="width: 72px;">
            <img id="lixo-4" class="lixo-drag" data-tipo="papel" src="imagens/lixo/papel%20e%20cartão/jornal.png" alt="Jornal Velho" style="width: 100px;">
            <img id="lixo-5" class="lixo-drag" data-tipo="vidro" src="imagens/lixo/vidro/garrafa%20partida.png" alt="Garrafa de Vidro" style="width: 88px;">
            <img id="lixo-6" class="lixo-drag" data-tipo="plastico" src="imagens/lixo/plástico%20e%20metal/garrafa%20plástico.png" alt="Garrafa de Plástico" style="width: 90px;">
            <img id="lixo-7" class="lixo-drag" data-tipo="papel" src="imagens/lixo/papel%20e%20cartão/mais%20caixa.webp" alt="Caixa de Embalagem" style="width: 95px;">
            <img id="lixo-8" class="lixo-drag" data-tipo="vidro" src="imagens/lixo/vidro/recipinete%20v.png" alt="Frasco de Vidro" style="width: 76px;">
            <img id="lixo-9" class="lixo-drag" data-tipo="plastico" src="imagens/lixo/plástico%20e%20metal/lata%20de%20metal.png" alt="Lata de Conserva" style="width: 72px;">
            <img id="lixo-10" class="lixo-drag" data-tipo="papel" src="imagens/lixo/papel%20e%20cartão/mais%20papel%20amassado.png" alt="Papel Amassado" style="width: 78px;">
            <img id="lixo-11" class="lixo-drag" data-tipo="plastico" src="imagens/lixo/plástico%20e%20metal/saco%20plástico.png" alt="Saco de Plástico" style="width: 96px;">
            <img id="lixo-12" class="lixo-drag" data-tipo="plastico" src="imagens/lixo/plástico%20e%20metal/latinha%20de%20metal.png" alt="Lata de Refrigerante" style="width: 72px;">
            <img id="lixo-13" class="lixo-drag" data-tipo="plastico" src="imagens/lixo/plástico%20e%20metal/garrafinha%20plastico.png" alt="Garrafinha de Água" style="width: 86px;">
            <img id="lixo-14" class="lixo-drag" data-tipo="papel" src="imagens/lixo/papel%20e%20cartão/papel%20amassado.png" alt="Folha Amassada" style="width: 76px;">

            <!-- Ecopontos (Contentores de Reciclagem) -->
            <div class="ecopontos-dock">
                <!-- Azul: Papel e Cartão -->
                <div class="ecoponto-drop-wrapper">
                    <img id="ecoponto-azul" class="ecoponto-drop" data-aceita="papel" src="imagens/ecopontos/papel%20e%20cartão%20cortado.png" alt="Ecoponto Azul (Papel e Cartão)">
                    <span class="ecoponto-label" style="color: var(--bin-papel);">Papel e Cartão</span>
                </div>
                <!-- Amarelo: Plástico e Metal -->
                <div class="ecoponto-drop-wrapper">
                    <img id="ecoponto-amarelo" class="ecoponto-drop" data-aceita="plastico" src="imagens/ecopontos/plástico%20e%20metal%20cortado.png" alt="Ecoponto Amarelo (Plástico e Metal)">
                    <span class="ecoponto-label" style="color: #A07000;">Plástico e Metal</span>
                </div>
                <!-- Verde: Vidro -->
                <div class="ecoponto-drop-wrapper">
                    <img id="ecoponto-verde" class="ecoponto-drop" data-aceita="vidro" src="imagens/ecopontos/vidro%20cortado.png" alt="Ecoponto Verde (Vidro)">
                    <span class="ecoponto-label" style="color: var(--bin-vidro);">Vidro</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Módulos Core -->
    <script src="js/audio-manager.js"></script>
    <script src="js/storage-manager.js"></script>
    <script src="js/drag-drop-engine.js"></script>
    <script src="js/game-hud.js"></script>

    <!-- Lógica do Nível 1 -->
    <script src="nivel1.js"></script>
</body>
</html>
